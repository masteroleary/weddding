<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C &amp; M — Photo Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --cream:#F5F0E8;
    --gold:#C4A97A;
    --gold-dark:#9A7B4F;
    --brown:#6B4A22;
    --espresso:#2B1A0F;
  }

  html{ scroll-behavior:smooth; background-color:#FAF4E8; }

  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    background:#F5EFE3;
    min-height:100vh;
    color:var(--espresso);
  }
  html, body { background-color: #FAF4E8; }

  /* ── Nav ── */
  .nav{
    display:flex;flex-wrap:wrap;gap:2px;justify-content:center;
    padding:1.25rem 1rem 0.75rem;
    position:sticky;top:0;
    background:rgba(245,240,232,0.95);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:100;
    border-bottom:1px solid rgba(196,169,122,0.4);
    width:100vw;
    margin-left:50%;
    transform:translateX(-50%);
  }
  .nav::before{
    content:'';
    display:block;
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0.6;
  }
  .nav button{
    background:transparent;border:none;
    font-size:15px;font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    color:var(--text-muted, #7A6040);cursor:pointer;
    padding:8px 14px 10px;
    border-radius:3px;
    transition:all .18s;
    letter-spacing:.06em;
    text-transform:uppercase;
    position:relative;
  }
  .nav button::after{
    content:'';position:absolute;bottom:0;left:50%;right:50%;
    height:2px;background:var(--gold);
    transition:left .2s,right .2s;
  }
  .nav button:hover{color:var(--espresso);transform:scale(1.15);}
  .nav button.active{color:var(--espresso)}
  .nav button.active::after{left:12px;right:12px}
  .nav-rsvp{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:8px 14px 8px !important;
    color:#FAF4E8 !important;
    font-weight:700 !important;
    font-family:'Cinzel',Georgia,serif !important;
    font-size:16px !important;
    letter-spacing:.18em !important;
    border:none !important;
    border-radius:0 !important;
  }
  .rsvp-swirl{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;height:100%;
    pointer-events:none;
    opacity:1;
    transition:opacity .2s;
    overflow:visible;
    z-index:0;
  }
  .nav-rsvp{ overflow:visible !important; z-index:1; }
  .nav-rsvp span, .nav-rsvp:not(svg){ position:relative; z-index:2; }

  .nav-rsvp:hover .nav-rsvp-heart,.nav-rsvp.active .nav-rsvp-heart{
    opacity:1;transform:translate(-50%,-52%) scale(1.08);
  }


  /* ── Page header ── */
  .page-header{
    text-align:center;padding:3rem 1rem 1rem;
  }
  .page-header h1{
    font-family:'Caveat',cursive;
    font-size:clamp(36px,6vw,62px);
    font-weight:600;
    color:var(--espresso);letter-spacing:.02em;
    margin-bottom:0.4rem;
  }
  .page-header p{
    font-size:16px;color:var(--gold-dark);letter-spacing:.06em;
  }
  .header-rule{
    width:80px;height:1px;background:var(--gold);
    margin:1rem auto 0;opacity:0.6;
  }

  /* ── Polaroid Wall ── */
  .polaroid-wall{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.5rem 2rem;
    padding:3rem 2rem 5rem;
    max-width:1200px;
    margin:0 auto;
  }

  .polaroid{
    background:#fff;
    padding:10px 10px 44px 10px;
    box-shadow:0 4px 18px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.10);
    cursor:pointer;
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    position:relative;
  }
  .polaroid:hover{
    transform:rotate(0deg) scale(1.07) translateY(-8px) !important;
    box-shadow:0 14px 40px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.14);
    z-index:10;
  }
  .polaroid img{
    display:block;
    width:220px;
    height:220px;
    object-fit:cover;
    object-position:center;
  }
  .polaroid .caption{
    position:absolute;
    bottom:10px;left:0;right:0;
    text-align:center;
    font-family:'Caveat',cursive;
    font-size:15px;
    color:#777;
    padding:0 8px;
  }

  /* ── Lightbox ── */
  #lightbox{
    display:none;position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,0.9);
    align-items:center;justify-content:center;
    cursor:zoom-out;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width:90vw;max-height:90vh;
    object-fit:contain;
    border-radius:2px;
    box-shadow:0 8px 40px rgba(0,0,0,0.6);
    cursor:default;
  }
  #lightbox-close{
    position:fixed;top:18px;right:24px;
    font-size:36px;color:#fff;
    background:none;border:none;cursor:pointer;
    line-height:1;opacity:0.8;
  }
  #lightbox-close:hover{opacity:1;}

  @media(max-width:600px){
    .polaroid img{width:150px;height:150px;}
    .polaroid{padding:7px 7px 36px 7px;}
    .polaroid-wall{gap:1.5rem 1rem;padding:2rem 1rem 4rem;}
  }
</style>
</head>
<body>

<nav class="nav">
    <button onclick="window.location.href='index.htm'">Home</button>
    <button onclick="window.location.href='details.htm'">Wedding Details</button>
    <button onclick="window.location.href='party.htm'">Wedding Party</button>
    <button class="nav-rsvp" onclick="window.location.href='rsvp.htm'">
      <span style="position:relative;z-index:2;">RSVP</span>
      <svg class="rsvp-swirl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 38" aria-hidden="true"><rect x="0" y="0" width="140" height="38" fill="#C4A97A" rx="1"/><polygon points="18,12 21,19 18,26 15,19" fill="#FAF4E8" opacity="0.85"/><polygon points="122,12 125,19 122,26 119,19" fill="#FAF4E8" opacity="0.85"/></svg>
    </button>
    <button onclick="window.location.href='registry.htm'">Registry</button>
    <button onclick="window.location.href='todo.htm'">Things to Do</button>
    <button class="active" onclick="window.location.href='travel-photobook.html'">Photo Gallery</button>
    <button onclick="window.location.href='faq.htm'">FAQ</button>
  </nav>

<div class="page-header">
  <h1>Our Travel Photos</h1>
  <p>Chelsea &amp; Matt</p>
  <div class="header-rule"></div>
</div>

<div class="polaroid-wall" id="polaroid-wall"></div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const photos = [
  'images/carousel-01.jpg',
  'images/carousel-02.jpg',
  'images/carousel-03.jpg',
  'images/carousel-04.jpg',
  'images/carousel-05.jpg',
  'images/carousel-06.jpg',
  'images/carousel-07.jpg',
  'images/carousel-08.jpg',
  'images/carousel-09.jpg',
  'images/carousel-10.jpg',
  'images/carousel-11.jpg',
  'images/carousel-12.jpg',
  'images/carousel-13.jpg',
  'images/carousel-14.jpg',
  'images/carousel-15.jpg',
  'images/carousel-16.jpg',
  'images/carousel-17.jpg',
  'images/carousel-18.jpg',
  'images/carousel-19.jpg',
];

// Fixed rotations so they stay put on hover
const rotations = [-3.2, 2.1, -1.5, 4.0, -2.8, 1.7, -4.1, 3.3, -1.1,
                    2.6, -3.7, 1.2, -2.3, 4.4, -1.8, 3.0, -2.5, 1.9, -3.4];

const wall = document.getElementById('polaroid-wall');

photos.forEach((src, i) => {
  const el = document.createElement('div');
  el.className = 'polaroid';
  el.style.transform = 'rotate(' + rotations[i] + 'deg)';
  el.innerHTML = `<img src="${src}" alt="Photo ${i+1}" loading="lazy"><div class="caption"></div>`;
  el.addEventListener('click', () => openLightbox(src));
  wall.appendChild(el);
});

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
  document.body.style.overflow = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
