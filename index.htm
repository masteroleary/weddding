<!-- Claude test edit — 2026-04-24 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C &amp; M — April 18, 2027</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&family=Great+Vibes&family=Dancing+Script:wght@400;500;600;700&family=Caveat:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --cream:#F7F2E8;
    --parchment:#EDE5D4;
    --gold:#C4A97A;
    --gold-dark:#9A7B4F;
    --gold-deep:#8B6914;
    --brown-light:#A4966B;
    --brown:#6B4A22;
    --brown-dark:#3D2B1A;
    --espresso:#2B1A0F;
    --text-body:#5C4A32;
    --text-muted:#7A6040;
    --border:rgba(139,105,20,0.28);
    --card-bg:rgba(255,250,242,0.88);
  }

  html{scroll-behavior:smooth;background-color:#FAF4E8;}

  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    background-color:#FAF4E8;
    color:var(--espresso);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  /* overflow-x:hidden removed from html — it breaks position:sticky */

  /* ── Background ── */
  html, body { background-color: #FAF4E8; }

  /* ── Layout ── */
  .site{
    position:relative;
    z-index:1;
    max-width:880px;
    margin:0 auto;
    min-height:100vh;
  }

  /* ── Nav ── */
  .nav{
    display:flex;flex-wrap:nowrap;gap:0;justify-content:space-evenly;overflow-x:auto;
    padding:1.25rem 1rem 0.75rem;
    position:sticky;top:0;
    background:rgba(245,240,232,0.95);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:100;
    border-bottom:1px solid rgba(196,169,122,0.4);
    width:100vw;
    margin-left:50%;
    transform:translateX(-50%);
  }
  .nav::before{
    content:'';
    display:block;
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0.6;
  }
  .nav button{
    background:transparent;border:none;
    font-size:15px;font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    color:var(--text-muted);cursor:pointer;
    padding:8px 14px 10px;
    border-radius:3px;
    transition:all .18s;
    letter-spacing:.06em;
    text-transform:uppercase;
    position:relative;
  }
  .nav button::after{
    content:'';position:absolute;bottom:0;left:50%;right:50%;
    height:2px;background:var(--gold);
    transition:left .2s,right .2s;
  }
  .nav button:hover{color:var(--espresso);transform:scale(1.15);}
  .nav button.active{color:var(--espresso)}
  .nav button.active::after{left:12px;right:12px}

  /* ── Nav RSVP highlight ── */
  .nav-rsvp{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:8px 14px 8px !important;
    color:#FAF4E8 !important;
    font-weight:700 !important;
    font-family:'Cinzel',Georgia,serif !important;
    font-size:16px !important;
    letter-spacing:.18em !important;
    border:none !important;
    border-radius:0 !important;
  }
  .rsvp-swirl{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;height:100%;
    pointer-events:none;
    opacity:1;
    transition:opacity .2s;
    overflow:visible;
    z-index:0;
  }
  .nav-rsvp{ overflow:visible !important; z-index:1; }
  .nav-rsvp span, .nav-rsvp:not(svg){ position:relative; z-index:2; }




  /* ── Pages ── */
  .page{display:none;padding:2.5rem 2rem 4rem;animation:fadeUp .4s ease both}
  .page.visible{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ── Hero Photo Banner ── */
  .hero-banner{
    position:relative;
    margin-top:-2.5rem;
    margin-left:calc(50% - 50vw);
    width:100vw;
    overflow:hidden;
    height:65vh;
    min-height:400px;
    max-height:680px;
  }
  .hero-banner-img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 38%;
    display:block;
  }
  .hero-banner-overlay{
    position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.04) 0%,
      rgba(0,0,0,0.22) 35%,
      rgba(0,0,0,0.32) 50%,
      rgba(0,0,0,0.22) 65%,
      rgba(0,0,0,0.04) 100%
    );
  }
  .hero-banner-names{
    position:absolute;
    top:44%;left:0;right:0;
    transform:translateY(-50%);
    text-align:center;
    font-family:'Great Vibes',cursive;
    font-size:clamp(52px,9vw,96px);
    font-weight:400;
    color:#fff;
    text-shadow:0 2px 28px rgba(0,0,0,0.5),0 0 80px rgba(0,0,0,0.18);
    line-height:1;
    letter-spacing:2px;
    padding:0 2rem;
    pointer-events:none;
    animation:nameReveal 1.1s cubic-bezier(.22,1,.36,1) .2s both;
    display:flex;flex-direction:column;align-items:center;gap:.6rem;
  }
  .hero-banner-date{
    font-family:'Cinzel',Georgia,serif;
    font-size:clamp(13px,1.9vw,17px);
    font-weight:400;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.95);
    text-shadow:0 1px 8px rgba(0,0,0,0.3);
    margin-top:.2rem;
    padding:.35em 1.2em .3em;
    background:rgba(0,0,0,0.28);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:2px;
    border:0.5px solid rgba(255,255,255,0.18);
  }
  .hero-banner-amp{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-style:italic;
    font-size:0.62em;
    font-weight:300;
    opacity:0.92;
    vertical-align:middle;
    margin:0 0.22em;
  }

  /* ── Hero (below photo) ── */
  .hero{
    text-align:center;
    padding:2.5rem 1rem 2rem;
    position:relative;
  }
  .hero-ornament{
    font-size:15px;letter-spacing:.3em;color:var(--gold);
    text-transform:uppercase;margin-bottom:1.5rem;display:block;
    font-weight:700;
  }
  /* ── Hero Names (new stacked design) ── */
  .hero-names-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    margin-bottom:.75rem;
    position:relative;
  }
  .hero-name{
    font-family:'Great Vibes',cursive;
    font-size:102px;font-weight:400;
    color:var(--espresso);line-height:1;
    display:block;
    animation:nameReveal .9s cubic-bezier(.22,1,.36,1) both;
  }
  .hero-name-chelsea{ animation-delay:.15s; }
  .hero-name-matt{ animation-delay:.4s; }
  @keyframes nameReveal{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  .hero-amp-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:.1rem 0 .15rem;
    animation:nameReveal .7s ease .3s both;
  }
  .hero-amp-dash{
    width:52px;height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    display:block;
  }
  .hero-amp-glyph{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:28px;font-style:italic;font-weight:300;
    color:var(--gold-dark);
    width:46px;height:46px;
    border-radius:50%;
    border:0.75px solid rgba(196,169,122,0.55);
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,250,242,0.6);
    letter-spacing:0;
    flex-shrink:0;
  }

  /* legacy — unused but kept to avoid any refs */
  .monogram{ display:none; }
  .ampersand{ color:var(--gold-dark); }

  .hero-rule{
    display:flex;align-items:center;gap:16px;
    max-width:340px;margin:.5rem auto 1.25rem;
  }
  .hero-rule::before,.hero-rule::after{
    content:'';flex:1;height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .hero-diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
  .date-line{
    font-size:16px;letter-spacing:.18em;color:var(--brown);
    text-transform:uppercase;margin-bottom:.5rem;
    font-weight:400;
    font-family:'Cinzel',Georgia,serif;
  }
  .tagline{
    font-size:36px;font-style:italic;font-weight:300;
    color:var(--gold-dark);margin-top:.5rem;
  }

  /* ── Our Story Heading ── */
  .story-section{max-width:none;margin:3rem 0 0;text-align:center}
  .story-heading-wrapper{
    margin-bottom:0;padding:0 2rem;
    animation:storyFadeIn 1.4s ease-out both;
  }
  @keyframes storyFadeIn{
    0%{opacity:0;transform:translateY(16px)}
    100%{opacity:1;transform:translateY(0)}
  }
  .story-eyebrow{
    font-family:'Great Vibes',cursive;
    font-size:clamp(44px,8vw,62px);
    font-weight:400;color:var(--gold-dark);
    display:block;line-height:1;
    margin-bottom:0.18em;
    margin-left:-1.4em;
  }
  .story-big-script{
    font-family:'Great Vibes',cursive;
    font-size:clamp(80px,16vw,130px);
    font-weight:400;color:var(--espresso);
    line-height:1;display:block;
  }
  .story-heading-rule{
    width:90px;height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:1.1rem auto 0;
  }
  /* ── Story Body (warm tan section) ── */
  .story-body-section{
    background:#7A5438;
    margin:2.25rem -2rem 0;
    padding:0 0 3.5rem;
    text-align:center;
    position:relative;
  }
  .story-ornament{
    width:100%;overflow:hidden;display:block;
    line-height:0;
  }
  .story-ornament-top{
    margin-bottom:2.75rem;
  }
  .story-ornament-bottom{
    margin-top:2.5rem;
  }
  .story-body-section p{
    font-size:19px;line-height:2.1;
    color:#F2E8D8;margin-bottom:1rem;font-weight:400;
    max-width:580px;margin-left:auto;margin-right:auto;
  }
  .story-divider{
    display:flex;align-items:center;gap:14px;
    margin:1.75rem auto;max-width:580px;
  }
  .story-divider::before,.story-divider::after{
    content:'';flex:1;height:0.5px;
    background:rgba(242,225,195,0.22);
  }
  .story-divider-glyph{font-size:16px;color:#D4B07A;line-height:1}
  .sign-off{
    margin-top:2rem;
    font-size:24px;font-style:italic;font-weight:300;
    color:#D4B07A;display:block;
  }
  @media(max-width:600px){
    .story-body-section{margin:2rem -1rem 0;}
  }

  /* ── Page header ── */
  .page-header{text-align:center;padding-bottom:2rem;margin-bottom:.5rem;position:relative}
  .page-header::after{
    content:'';display:block;width:80px;height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:1.25rem auto 0;
  }
  .page-header h1{
    font-size:36px;font-weight:300;letter-spacing:.08em;
    color:var(--espresso);margin-bottom:.4rem;
  }
  .page-header p{font-size:15px;font-style:italic;color:var(--text-muted);font-weight:300}

  /* ── Cards shared ── */
  .card{
    background:var(--card-bg);
    border:0.5px solid var(--border);
    border-radius:6px;
    padding:1.35rem 1.6rem;
  }
  .card-icon{font-size:19px;margin-bottom:.6rem;display:block}
  .card-label{
    font-size:15px;font-weight:500;letter-spacing:.2em;
    color:var(--gold-dark);text-transform:uppercase;
    margin-bottom:.5rem;display:block;
  }
  .card p{font-size:15px;line-height:1.85;color:var(--brown-dark)}
  .card a{
    color:var(--gold-deep);text-decoration:none;
    font-size:15px;letter-spacing:.04em;
    border-bottom:0.5px solid transparent;
    transition:border-color .15s;
  }
  .card a:hover{border-color:var(--gold-deep)}

  /* ── Detail grid ── */
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1.5rem}

  /* ── Party ── */
  .party-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:.85rem;margin:1.25rem 0}
  .person-card{
    text-align:center;padding:1.35rem 1rem;
    background:var(--card-bg);border:0.5px solid var(--border);border-radius:6px;
  }
  .avatar{
    width:54px;height:54px;border-radius:50%;
    margin:0 auto .85rem;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:500;letter-spacing:0;
    border:1px solid rgba(139,105,20,0.35);
    font-family:'Cormorant Garamond',Georgia,serif;
  }
  .person-card h4{font-size:15px;font-weight:400;color:var(--espresso);margin-bottom:3px}
  .person-role{font-size:15px;color:var(--gold-dark);letter-spacing:.14em;text-transform:uppercase}
  .section-label{
    font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-dark);margin:2.25rem 0 .85rem;
    border-bottom:0.5px solid rgba(139,105,20,0.22);padding-bottom:.6rem;
  }

  /* ── RSVP ── */
  .rsvp-wrap{max-width:500px;margin:1.75rem auto}
  .form-group{margin-bottom:1.25rem}
  .form-group label{
    display:block;font-size:15px;font-weight:500;
    color:var(--gold-dark);letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:.45rem;
  }
  .form-group input,.form-group select,.form-group textarea{
    width:100%;padding:10px 13px;
    font-size:15px;font-family:'Cormorant Garamond',Georgia,serif;
    border-radius:4px;border:0.5px solid rgba(139,105,20,0.4);
    background:rgba(255,250,242,0.92);color:var(--espresso);
    outline:none;transition:border .18s;
    -webkit-appearance:none;appearance:none;
  }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
    border-color:var(--gold-dark);
    box-shadow:0 0 0 3px rgba(154,123,79,0.1);
  }
  .form-group textarea{height:90px;resize:vertical}
  .submit-btn{
    width:100%;padding:13px;
    font-size:15px;font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    border:1px solid var(--espresso);border-radius:4px;
    background:var(--espresso);color:var(--cream);
    cursor:pointer;margin-top:.75rem;
    transition:opacity .18s,transform .1s;
  }
  .submit-btn:hover{opacity:.88}
  .submit-btn:active{transform:scale(0.99)}

  /* ── Travel Stamp RSVP ── */
  .stamp-rsvp{
    display:inline-block;
    text-decoration:none;
    cursor:pointer;
    filter:drop-shadow(0 4px 14px rgba(43,26,15,0.18));
    transition:transform .22s ease, filter .22s ease;
    vertical-align:middle;
  }
  .stamp-rsvp:hover{
    transform:scale(1.05) rotate(-1.2deg);
    filter:drop-shadow(0 7px 22px rgba(43,26,15,0.26));
  }
  .stamp-rsvp:active{transform:scale(0.97) rotate(0deg)}
  .stamp-rsvp svg{display:block}
  .rsvp-thanks{
    text-align:center;padding:3rem 1rem;display:none;
    font-size:17px;font-style:italic;font-weight:300;
    color:var(--text-body);line-height:2;
  }

  /* ── Registry ── */
  .registry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:1.5rem 0}
  .registry-item{
    border:0.5px solid var(--border);border-radius:6px;
    padding:1.35rem;background:var(--card-bg);
  }
  .registry-item h3{font-size:18px;font-weight:400;color:var(--espresso);margin-bottom:.4rem}
  .registry-item p{font-size:15px;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.75;font-style:italic}
  .registry-link{
    display:inline-block;font-size:15px;font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--espresso);border:0.5px solid rgba(139,105,20,0.45);
    border-radius:3px;padding:6px 14px;text-decoration:none;
    transition:background .15s;
  }
  .registry-link:hover{background:rgba(196,169,122,0.18)}

  /* ── Travel ── */
  .travel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1.5rem}
  .hotel-card{border:0.5px solid var(--border);border-radius:6px;padding:1.35rem;background:var(--card-bg)}
  .badge{
    display:inline-block;font-size:15px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    padding:3px 10px;border-radius:3px;margin-bottom:.65rem;
    font-family:'Cormorant Garamond',Georgia,serif;
  }
  .badge-block{background:rgba(139,105,20,0.12);color:var(--brown)}
  .badge-near{background:rgba(100,80,40,0.1);color:var(--text-muted)}
  .badge-budget{background:rgba(180,140,60,0.12);color:var(--brown)}
  .hotel-card h3{font-size:17px;font-weight:400;color:var(--espresso);margin-bottom:.3rem}
  .hotel-card p{font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:.4rem;font-style:italic}
  .hotel-card .price{font-size:15px;font-weight:500;color:var(--espresso);margin-top:.4rem;font-style:normal}
  .hotel-card a{font-size:15px;color:var(--gold-deep);text-decoration:none;letter-spacing:.03em}
  .hotel-card a:hover{text-decoration:underline}

  /* ── Things to do ── */
  .todo-list{margin-top:1.5rem;display:grid;gap:.85rem}
  .todo-item{
    display:flex;gap:1.1rem;padding:1.1rem 1.35rem;
    border-radius:6px;border:0.5px solid var(--border);background:var(--card-bg);
  }
  .todo-icon{font-size:20px;flex-shrink:0;margin-top:2px;line-height:1}
  .todo-item h4{font-size:17px;font-weight:400;color:var(--espresso);margin-bottom:.25rem}
  .todo-item p{font-size:15px;color:var(--text-muted);line-height:1.75;font-style:italic}

  /* ── FAQ ── */
  .faq-list{margin-top:1.5rem}
  .faq-item{border-bottom:0.5px solid rgba(139,105,20,0.22);padding:.9rem 0}
  .faq-q{
    font-size:16px;font-weight:400;color:var(--espresso);
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;
    user-select:none;
  }
  .faq-chevron{
    font-size:15px;color:var(--gold-dark);transition:transform .22s;flex-shrink:0;
    width:16px;height:16px;display:flex;align-items:center;justify-content:center;
    border:0.5px solid rgba(139,105,20,0.35);border-radius:50%;
  }
  .faq-a{
    font-size:15px;color:var(--text-muted);line-height:1.85;
    max-height:0;overflow:hidden;transition:max-height .28s ease,padding .28s;
    font-style:italic;
  }
  .faq-item.open .faq-chevron{transform:rotate(180deg)}
  .faq-item.open .faq-a{max-height:220px;padding-top:.55rem}

  /* ── Note box ── */
  .note-box{
    background:rgba(196,169,122,0.1);
    border:0.5px solid rgba(196,169,122,0.45);
    border-radius:5px;padding:1rem 1.35rem;
    font-size:15px;color:var(--text-muted);
    line-height:1.8;margin-top:1.5rem;font-style:italic;
  }
  .note-box::before{content:'✦  ';color:var(--gold)}


  /* ── Carousel ── */
  .carousel-wrap{
    margin:2rem auto 0;
    max-width:760px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .carousel-middle-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
  }
  .carousel{
    position:relative;
    overflow:hidden;
    border-radius:10px;
    height:400px;
    background:transparent;
    flex:1;
    min-width:0;
  }
  .carousel-slides{
    position:relative;
    height:100%;
  }
  .carousel-slide{
    position:absolute;
    inset:0;
    background-size:contain;
    background-position:center center;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity .7s ease, transform .7s ease;
    transform:scale(1.03);
  }
  .carousel-slide.active{ opacity:1; transform:scale(1); }
  .carousel-slide.exit-left{ opacity:0; transform:scale(0.97) translateX(-30px); }
  .carousel-slide.exit-right{ opacity:0; transform:scale(0.97) translateX(30px); }
  .carousel-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin-top:1rem;
    width:100%;
  }
  .carousel-btn{
    width:48px; height:48px;
    background:transparent;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all .28s ease;
    flex-shrink:0;
    padding:0;
    align-self:center;
    color:var(--gold-dark);
  }
  .carousel-btn:hover{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold);
    transform:scale(1.08);
  }
  .carousel-btn svg{ width:22px; height:22px; }
  .carousel-dots{ display:none; }
  .carousel-dot{ display:none; }

  /* ── RV Road Progress ── */
  .rv-road-wrap{
    flex:1;
    position:relative;
    height:44px;
    display:flex;
    align-items:center;
    min-width:0;
  }
  .rv-road-track{
    position:relative;
    width:100%;
    height:44px;
    display:flex;
    align-items:center;
    cursor:pointer;
  }
  /* road surface */
  .rv-road-surface{
    position:absolute;
    left:0;right:0;
    height:10px;
    top:50%;transform:translateY(-50%);
    background:#3D2B1A;
    border-radius:5px;
  }
  /* dashed center line */
  .rv-road-dash{
    position:absolute;
    left:0;right:0;
    height:1.5px;
    top:50%;transform:translateY(-50%);
    background:repeating-linear-gradient(90deg,#C4A97A 0px,#C4A97A 8px,transparent 8px,transparent 16px);
    border-radius:2px;
  }
  /* progress fill */
  .rv-road-progress{
    position:absolute;
    left:0;
    height:10px;
    top:50%;transform:translateY(-50%);
    background:#9A7B4F;
    border-radius:5px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  /* the RV icon on the road */
  .rv-road-vehicle{
    position:absolute;
    top:50%;
    transform:translate(-50%,-62%);
    transition:left .5s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
    filter:drop-shadow(0 1px 3px rgba(43,26,15,0.25));
  }
  .rv-road-vehicle svg{
    width:52px;
    height:26px;
  }
  .carousel-counter{ display:none; }

  /* ── Venue Banner ── */
  .venue-banner{
    margin:2rem 0 0;
    text-align:center;
    padding:2.5rem 2rem;
    background:rgba(255,250,242,0.7);
    border:0.5px solid rgba(139,105,20,0.25);
    border-radius:8px;
    position:relative;
  }
  .venue-banner::before,.venue-banner::after{
    content:'';display:block;
    height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:0 auto;width:80%;
  }
  .venue-banner::before{margin-bottom:1.5rem}
  .venue-banner::after{margin-top:1.5rem}
  .venue-banner-inner{padding:.5rem 0}
  .venue-eyebrow{
    font-size:15px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold-dark);display:block;margin-bottom:.6rem;
  }
  .venue-names{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:42px;font-weight:300;color:var(--espresso);
    letter-spacing:2px;line-height:1.1;
  }
  .venue-amp{color:var(--gold-dark);font-style:italic}
  .venue-rule{
    display:flex;align-items:center;justify-content:center;
    margin:.75rem auto;
  }
  .venue-diamond{
    width:7px;height:7px;background:var(--gold);
    transform:rotate(45deg);
  }
  .venue-place{
    font-size:20px;font-weight:400;letter-spacing:.1em;
    color:var(--espresso);margin-bottom:.3rem;
    font-family:'Cormorant Garamond',Georgia,serif;
  }
  .venue-address{
    font-size:15px;letter-spacing:.08em;color:var(--text-muted);
    margin-bottom:.75rem;
  }
  .venue-map-link{
    font-size:15px;letter-spacing:.1em;color:var(--gold-deep);
    text-decoration:none;text-transform:uppercase;
    border-bottom:0.5px solid var(--gold-deep);
    transition:opacity .15s;
  }
  .venue-map-link:hover{opacity:.7}

  /* ── Timeline ── */
  .timeline-wrap{
    max-width:520px;
    margin:2.5rem auto 0;
  }
  .timeline-heading{
    text-align:center;
    font-size:15px;font-weight:500;letter-spacing:.28em;
    text-transform:uppercase;color:var(--gold-dark);
    margin-bottom:1.75rem;
  }
  .timeline{ display:flex; flex-direction:column; }
  .timeline-item{
    display:grid;
    grid-template-columns:80px 28px 1fr;
    gap:0 12px;
    align-items:start;
    min-height:70px;
  }
  .timeline-time{
    text-align:right;
    font-size:12px;letter-spacing:.08em;
    color:var(--gold-dark);font-weight:500;
    padding-top:3px;
    text-transform:uppercase;
    font-family:'Cinzel',Georgia,serif;
    line-height:1.4;
  }
  .timeline-dot-col{
    display:flex;flex-direction:column;align-items:center;
  }
  .timeline-dot{
    width:11px;height:11px;
    border-radius:50%;
    background:var(--cream);
    border:1.5px solid var(--gold);
    flex-shrink:0;
    margin-top:3px;
    position:relative;
    z-index:1;
  }
  .timeline-dot-last{
    background:var(--gold);
  }
  .timeline-line{
    flex:1;
    width:1px;
    background:linear-gradient(to bottom,var(--gold),rgba(196,169,122,0.2));
    min-height:48px;
    margin-top:3px;
  }
  .timeline-line-hidden{ background:transparent; }
  .timeline-content{
    padding-bottom:1.5rem;
  }
  .timeline-title{
    font-size:17px;font-weight:400;
    color:var(--espresso);margin-bottom:.25rem;
    font-family:'Cormorant Garamond',Georgia,serif;
    letter-spacing:.04em;
  }
  .timeline-desc{
    font-size:15px;color:var(--text-muted);
    line-height:1.75;font-style:italic;
  }


  /* ── Countdown ── */
  .countdown-wrap{
    margin:2.25rem auto 0;
    max-width:560px;
    text-align:center;
  }
  .countdown-label{
    font-family:'Cinzel',Georgia,serif;
    font-size:12px;letter-spacing:.36em;text-transform:uppercase;
    color:var(--gold-dark);margin-bottom:1.4rem;display:block;
  }
  .countdown-rule{ display:none; }
  .countdown-rule-glyph{ display:none; }
  .countdown-boxes{
    display:flex;align-items:stretch;justify-content:center;gap:10px;
    flex-wrap:wrap;
  }
  .countdown-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#F8F2E6;
    border:1px solid var(--gold);
    border-radius:3px;
    padding:1.1rem 0 .9rem;
    min-width:108px;
    position:relative;
  }
  /* gold top accent bar */
  .countdown-box::before{
    content:'';
    position:absolute;top:0;left:18px;right:18px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .countdown-num{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(42px,7vw,58px);
    font-weight:300;
    color:var(--espresso);
    line-height:1;
    letter-spacing:.02em;
  }
  .countdown-unit{
    font-family:'Cinzel',Georgia,serif;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-dark);margin-top:.6rem;
  }
  .countdown-sep{
    display:flex;align-items:center;
    font-size:20px;color:var(--gold);opacity:0.5;
    align-self:center;margin-bottom:18px;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;
  }

  /* ── Quote ── */
  .wedding-quote{
    margin:2.5rem auto 0;
    max-width:480px;
    text-align:center;
  }
  .quote-rule{
    height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:.75rem auto;
    width:60%;
  }
  .quote-text{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:18px;font-style:italic;font-weight:300;
    color:var(--text-body);line-height:1.9;
    margin-bottom:.4rem !important;
  }
  .quote-attr{
    font-size:15px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold-dark) !important;font-style:normal !important;
  }


  /* ── RV End Animation ── */
  .rv-end-scene{
    display:none;
    width:100%;
    height:130px;
    position:relative;
    overflow:hidden;
    margin-top:.75rem;
  }
  .rv-end-scene.visible{ display:block; }

  .rv-ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height:18px;
    background:#3D2B1A;
    border-radius:4px;
  }
  .rv-ground-dash{
    position:absolute;
    bottom:7px; left:0; right:0;
    height:2px;
    background:repeating-linear-gradient(90deg,#C4A97A 0,#C4A97A 12px,transparent 12px,transparent 24px);
  }

  .rv-anim-rv{
    position:absolute;
    bottom:14px;
    left:-160px;
    -webkit-transition: left 1.2s cubic-bezier(.4,0,.2,1);
    transition: left 1.2s cubic-bezier(.4,0,.2,1);
  }

  .rv-char{
    position:absolute;
    bottom:14px;
    opacity:0;
    -webkit-transition: opacity 0.3s ease, -webkit-transform 1.4s cubic-bezier(.4,0,.2,1);
    transition: opacity 0.3s ease, transform 1.4s cubic-bezier(.4,0,.2,1);
  }
  .rv-char.visible{
    opacity:1;
    -webkit-transform: scale(1) translateY(0);
    transform: scale(1) translateY(0);
  }
  .rv-char.run{
    -webkit-transform: translateX(1200px);
    transform: translateX(1200px);
    opacity: 0;
  }

  .rv-dust{
    position:absolute;
    bottom:18px;
    border-radius:50%;
    background:#C4A97A;
    opacity:0;
    pointer-events:none;
    -webkit-transition: opacity .6s ease, -webkit-transform .8s ease;
    transition: opacity .6s ease, transform .8s ease;
  }
  .rv-dust.puff{
    opacity:0;
    -webkit-transform: scale(2.5) translateY(-20px);
    transform: scale(2.5) translateY(-20px);
  }

  /* ── Envelope Letter Animation ── */
  .envelope-wrapper{position:relative;margin:6rem auto 1.75rem;max-width:760px;}
  .env-flap-anim{
    position:absolute;top:0;left:0;width:100%;height:160px;
    z-index:6;pointer-events:none;
    transform-origin:top center;
    transition:transform 1.1s cubic-bezier(.3,0,.2,1);
    /* Clip to triangle so only flap shape is visible (both closed and open) */
    clip-path:polygon(0% 0%, 100% 0%, 50% 100%);
    /* Back-face visible when flap flips open */
    background:
      radial-gradient(ellipse at 50% 20%, rgba(60,44,20,0.14) 0%, transparent 55%),
      linear-gradient(175deg,#DDD4B8 0%,#D4CAA8 40%,#DDD4B8 100%);
    backface-visibility:visible;
  }
  .env-flap-anim.flap-open{transform:perspective(700px) rotateX(180deg)}
  .wax-seal-btn{
    position:absolute;top:142px;left:50%;transform:translateX(-50%);
    z-index:10;background:none;border:none;padding:0;cursor:pointer;
    transition:filter .2s;
  }
  .wax-seal-btn:hover{filter:brightness(1.12) drop-shadow(0 2px 8px rgba(80,30,5,0.35))}
  .wax-seal-btn.seal-broken{
    transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;
    transform:translateX(-50%) rotate(22deg) scale(0.5) !important;
    opacity:0 !important;pointer-events:none;
  }
  .env-letter{
    position:absolute;
    top:60px; left:3%; width:94%;
    z-index:3;
    background:
      linear-gradient(162deg, #F7F1E4 0%, #F3EDD8 40%, #F5EFE0 100%);
    border:none;
    border-radius:2px;
    padding:2.5rem 2.5rem;
    box-shadow:
      0 14px 40px rgba(43,26,15,0.28),
      inset 0 0 60px rgba(120,80,10,0.06),
      inset 0 0 14px rgba(160,70,5,0.18);
    opacity:0;
    pointer-events:none;
    /* Irregular burnt/torn edges */
    clip-path: polygon(
      1% 0.8%,  4% 0%,    9% 0.6%,  15% 0%,   21% 0.9%,  28% 0.2%,
      35% 0.7%, 42% 0%,   49% 0.5%, 57% 0%,   64% 0.8%,  71% 0.1%,
      78% 0.6%, 85% 0%,   91% 0.7%, 96% 0.2%, 99% 0.9%,
      100% 4%,  99.2% 12%, 100% 22%, 99.4% 34%, 100% 46%,
      99.3% 58%, 100% 70%, 99.5% 82%, 100% 92%, 99% 100%,
      93% 99.2%, 85% 100%, 77% 99.4%, 69% 100%, 61% 99.3%,
      53% 100%,  45% 99.5%, 37% 100%, 29% 99.2%, 21% 100%,
      13% 99.5%, 6% 100%,  1% 99%,
      0% 93%,   0.6% 82%, 0% 70%,   0.5% 58%, 0% 46%,
      0.7% 34%, 0% 22%,   0.4% 12%, 0% 4%
    );
  }
  /* Burnt edge dark overlay */
  .env-letter::before{
    content:'';
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      radial-gradient(ellipse at 0% 0%,   rgba(8,3,0,0.32) 0%, rgba(25,8,1,0.14) 10%, transparent 24%),
      radial-gradient(ellipse at 100% 0%,  rgba(8,3,0,0.32) 0%, rgba(25,8,1,0.14) 10%, transparent 24%),
      radial-gradient(ellipse at 0% 100%,  rgba(8,3,0,0.32) 0%, rgba(25,8,1,0.14) 10%, transparent 24%),
      radial-gradient(ellipse at 100% 100%,rgba(8,3,0,0.32) 0%, rgba(25,8,1,0.14) 10%, transparent 24%),
      linear-gradient(to bottom, rgba(12,4,0,0.22) 0%, rgba(20,7,1,0.10) 5%, rgba(140,60,5,0.03) 11%, transparent 20%),
      linear-gradient(to top,    rgba(12,4,0,0.22) 0%, rgba(20,7,1,0.10) 5%, rgba(140,60,5,0.03) 11%, transparent 20%),
      linear-gradient(to right,  rgba(12,4,0,0.18) 0%, rgba(20,7,1,0.08) 4%, transparent 12%),
      linear-gradient(to left,   rgba(12,4,0,0.18) 0%, rgba(20,7,1,0.08) 4%, transparent 12%);
    border-radius:inherit;
  }
  /* Ruled lines */
  .env-letter::after{
    content:'';
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,transparent 28px,
        rgba(139,100,20,0.045) 28px,
        rgba(139,100,20,0.045) 29px
      );
    border-radius:inherit;
  }
  .env-letter p{
    font-family:'EB Garamond',serif;
    font-size:20px;font-weight:400;line-height:1.9;color:#2E1A08;
    margin-bottom:1rem;max-width:520px;margin-left:auto;margin-right:auto;
    position:relative;z-index:1;letter-spacing:0.01em;
  }
  .env-letter .env-letter-signoff{
    font-family:'Dancing Script',cursive;
    font-size:32px;font-style:normal;font-weight:700;color:#7A5018;
    display:block;text-align:center;margin-top:1rem;
    position:relative;z-index:1;
  }
  /* Handwriting animation */
  .letter-wc{ visibility:hidden; display:inline; }
  .letter-wc.written{ visibility:visible; }
  /* Outer wrapper — tracks left/top position of current character */
  #letter-pen{
    position:absolute;
    pointer-events:none;
    z-index:20;
    opacity:1;
    transition:left 0.38s linear,top 0.30s linear,opacity 0.8s ease;
  }
  /* Inner wrapper — runs the slow writing animation */
  #letter-pen-inner{
    transform-origin:bottom center;
    animation:penWrite 1.6s ease-in-out infinite;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,0.45));
  }
  @keyframes penWrite{
    0%   { transform:translateX(0px)   rotate(-48deg) translate(-8px,-72px); }
    20%  { transform:translateX(6px)   rotate(-44deg) translate(-8px,-72px); }
    45%  { transform:translateX(-3px)  rotate(-49deg) translate(-8px,-72px); }
    65%  { transform:translateX(5px)   rotate(-43deg) translate(-8px,-72px); }
    85%  { transform:translateX(-2px)  rotate(-47deg) translate(-8px,-72px); }
    100% { transform:translateX(0px)   rotate(-48deg) translate(-8px,-72px); }
  }
  .env-letter-eyebrow,.env-letter-heading,.env-letter-rule,.story-divider-letter{
    position:relative;z-index:1;
  }
  .env-letter-rule{
    display:flex;align-items:center;gap:14px;max-width:320px;margin:.9rem auto;
  }
  .env-letter-rule::before,.env-letter-rule::after{
    content:'';flex:1;height:0.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .env-letter-diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
  .env-letter-heading{
    text-align:center;font-family:'Great Vibes',cursive;
    font-size:clamp(60px,10vw,90px);font-weight:400;
    color:var(--espresso);line-height:1;margin-bottom:.25rem;
  }
  .env-letter-eyebrow{
    display:block;text-align:center;font-family:'Great Vibes',cursive;
    font-size:clamp(36px,6vw,50px);color:var(--gold-dark);font-weight:400;line-height:1;
  }
  .story-divider-letter{
    display:flex;align-items:center;gap:14px;max-width:520px;margin:1.75rem auto;
  }
  .story-divider-letter::before,.story-divider-letter::after{
    content:'';flex:1;height:0.5px;background:rgba(139,105,20,0.2);
  }

  /* ── Home page: white text on tan/brown ── */
  /* #page-home — dark text from base CSS vars, no overrides needed for light background */

  /* ── Our Story ── */
  .story-wrap{max-width:580px;margin:3rem auto;text-align:center}
  .story-section-eyebrow{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:4px;
    color:var(--gold-dark);text-transform:uppercase;opacity:.7;margin-bottom:2rem;
  }
  .story-entry{margin:0 0 2.75rem}
  .story-entry-title{
    font-family:'Great Vibes',cursive;font-size:clamp(36px,5.5vw,50px);
    color:var(--espresso);line-height:1;margin-bottom:.65rem;
  }
  .story-entry-rule{
    width:32px;height:.5px;background:var(--gold);
    margin:0 auto .9rem;opacity:.6;
  }
  .story-entry-text{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:16px;line-height:1.9;color:var(--text-body);font-style:italic;
  }
  .story-divider-glyph-wrap{
    display:flex;align-items:center;gap:14px;margin:0 auto 2.75rem;max-width:200px;
  }
  .story-divider-glyph-wrap::before,.story-divider-glyph-wrap::after{
    content:'';flex:1;height:.5px;background:rgba(196,169,122,0.4);
  }
  .story-glyph{font-size:15px;color:var(--gold-dark);opacity:.55}

  /* ── Responsive ── */
  @media(max-width:600px){
    .nav button{font-size:15px;padding:6px 8px;letter-spacing:.08em}
    .hero-banner{margin-top:-2rem;min-height:300px}
    .page{padding:1.5rem 1rem 3rem}
    .story-body-section{margin:2rem -1rem 0;}

    /* Hero */
    .monogram{font-size:52px;letter-spacing:2px}
    .date-line{font-size:15px;letter-spacing:.1em}
    .tagline{font-size:28px}

    /* Countdown */
    .countdown-wrap{max-width:100%;padding:0 .5rem}
    .countdown-boxes{gap:6px}
    .countdown-box{min-width:72px;padding:.8rem 0 .6rem}
    .countdown-num{font-size:clamp(32px,8vw,46px)}
    .countdown-unit{font-size:15px;letter-spacing:.16em}
    .countdown-sep{font-size:16px;margin-bottom:12px}

    /* Envelope — full width on mobile */
    .envelope-card{
      margin-left:-1rem !important;
      margin-right:-1rem !important;
      max-width:none !important;
      border-radius:0 !important;
      border-left:none !important;
      border-right:none !important;
    }
    .envelope-card .stamp-rsvp svg{width:76px !important;height:76px !important}

    /* Story section */
    .story-section h2{font-size:18px;letter-spacing:.18em}
    .story-body-section p{font-size:16px;line-height:1.9}
  }
</style>
</head>

<script>
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('visible');
  btn.classList.add('active');
}

function toggleFAQ(item) {
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(i => i.classList.remove('open'));
  if (!wasOpen) item.classList.add('open');
}

// Carousel
const carouselPhotos = [
  "images/carousel-01.jpg",
  "images/carousel-02.jpg",
  "images/carousel-03.jpg",
  "images/carousel-04.jpg",
  "images/carousel-05.jpg",
  "images/carousel-06.jpg",
  "images/carousel-07.jpg",
  "images/carousel-08.jpg",
  "images/carousel-09.jpg",

  "images/carousel-10.jpg",
  "images/carousel-11.jpg",
  "images/carousel-12.jpg",
  "images/carousel-13.jpg",
  "images/carousel-14.jpg",
  "images/carousel-15.jpg",
  "images/carousel-16.jpg",
  "images/carousel-17.jpg",
  "images/carousel-18.jpg",
  "images/carousel-19.jpg",
];
let carouselIdx = 0;

function buildCarousel() {
  const slidesEl = document.getElementById('carousel-slides');
  const dotsEl = document.getElementById('carousel-dots');
  if (!slidesEl || !dotsEl) return;
  carouselPhotos.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'carousel-slide' + (i===0 ? ' active' : '');
    div.style.backgroundImage = `url('${src}')`;
    slidesEl.appendChild(div);

    const dot = document.createElement('button');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = () => goTo(i);
    dotsEl.appendChild(dot);
  });
  updateCounter();
  updateRoad();
}

function updateCounter() {
  const counter = document.getElementById('carousel-counter');
  if (counter) counter.textContent = (carouselIdx+1) + ' / ' + carouselPhotos.length;
  updateRoad();
}

function updateRoad() {
  const total = carouselPhotos.length;
  const pct = carouselIdx / (total - 1) * 100;
  const progress = document.getElementById('rv-road-progress');
  const vehicle = document.getElementById('rv-road-vehicle');
  if (progress) progress.style.width = pct + '%';
  if (vehicle) vehicle.style.left = Math.max(3, Math.min(97, pct)) + '%';
}

function roadClick(e) {
  const track = document.getElementById('rv-road-track');
  if (!track) return;
  const rect = track.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const idx = Math.round(pct * (carouselPhotos.length - 1));
  goTo(Math.max(0, Math.min(carouselPhotos.length - 1, idx)));
}

function goTo(newIdx) {
  const slides = document.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('.carousel-dot');
  if (!slides.length) return;
  const direction = newIdx > carouselIdx ? 'left' : 'right';

  slides[carouselIdx].classList.remove('active');
  slides[carouselIdx].classList.add('exit-' + direction);
  setTimeout(() => { slides[carouselIdx].classList.remove('exit-left','exit-right'); }, 700);

  carouselIdx = (newIdx + carouselPhotos.length) % carouselPhotos.length;
  slides[carouselIdx].classList.add('active');

  dots.forEach((d,i) => d.classList.toggle('active', i===carouselIdx));
  updateCounter();
  checkEndScene(carouselIdx);
}

document.addEventListener('DOMContentLoaded', buildCarousel);

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) goTo(carouselIdx + (diff > 0 ? 1 : -1));
});


// Countdown to April 18, 2027 5:30 PM
function updateCountdown() {
  const daysEl = document.getElementById('cd-days');
  const hoursEl = document.getElementById('cd-hours');
  const minsEl = document.getElementById('cd-mins');
  const secsEl = document.getElementById('cd-secs');
  if (!daysEl || !hoursEl || !minsEl || !secsEl) return;
  const wedding = new Date('2027-04-18T17:30:00');
  const now = new Date();
  const diff = wedding - now;
  if (diff <= 0) {
    daysEl.textContent = '0';
    hoursEl.textContent = '00';
    minsEl.textContent = '00';
    secsEl.textContent = '00';
    return;
  }
  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  const secs = Math.floor((diff % (1000*60)) / 1000);
  daysEl.textContent = days;
  hoursEl.textContent = String(hours).padStart(2,'0');
  minsEl.textContent = String(mins).padStart(2,'0');
  secsEl.textContent = String(secs).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);


// RV end scene animation - Safari compatible
let endScenePlayed = false;

function checkEndScene(idx) {
  const scene = document.getElementById('rv-end-scene');
  if (!scene) return;
  if (idx === carouselPhotos.length - 1 && !endScenePlayed) {
    endScenePlayed = true;
    scene.classList.add('visible');
    playEndScene();
  } else if (idx < carouselPhotos.length - 1) {
    endScenePlayed = false;
    scene.classList.remove('visible');
    resetEndScene();
  }
}

function resetEndScene() {
  const rv = document.getElementById('rv-anim-rv');
  if (rv) { rv.style.left = '-160px'; }
  ['char-groom','char-bride','char-dog1','char-dog2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.style.transition = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateX(0)';
    }
  });
  ['dust1','dust2','dust3'].forEach(id => {
    const d = document.getElementById(id);
    if (d) { d.style.opacity = '0'; d.style.transform = 'scale(1)'; }
  });
}

function playEndScene() {
  const rv = document.getElementById('rv-anim-rv');

  // Step 1: RV drives in using JS transition
  setTimeout(() => {
    if (rv) rv.style.left = '30px';
  }, 200);

  // Step 2: Characters appear one by one
  const charIds = ['char-groom','char-bride','char-dog1','char-dog2'];
  const delays  = [1400, 1800, 2100, 2350];

  charIds.forEach((id, i) => {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) {
        el.style.transition = 'opacity 0.35s ease';
        el.style.opacity = '1';
      }
    }, delays[i]);
  });

  // Step 3: Dust puffs
  setTimeout(() => {
    ['dust1','dust2','dust3'].forEach((id, i) => {
      setTimeout(() => {
        const d = document.getElementById(id);
        if (d) {
          d.style.opacity = '0.5';
          setTimeout(() => {
            d.style.opacity = '0';
            d.style.transform = 'scale(2.5) translateY(-20px)';
          }, 50);
        }
      }, i * 120);
    });
  }, 2700);

  // Step 4: Everyone runs off screen
  setTimeout(() => {
    charIds.forEach((id, i) => {
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          el.style.transition = 'transform 1.2s cubic-bezier(.4,0,.2,1), opacity 1.2s ease';
          el.style.transform = 'translateX(1200px)';
          setTimeout(() => { el.style.opacity = '0'; }, 800);
        }
      }, i * 80);
    });
    // RV drives off
    setTimeout(() => {
      if (rv) rv.style.left = '110%';
    }, 200);
  }, 3300);
}

// Auto-open envelope when it crosses the middle of the screen
document.addEventListener('DOMContentLoaded', function() {
  const envObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting && !envelopeOpened) {
        openEnvelopeLetter();
      }
    });
  }, {
    rootMargin: '-50% 0px -50% 0px',
    threshold: 0
  });
  const wrapper = document.getElementById('envelope-wrapper');
  if (wrapper) envObserver.observe(wrapper);
});

// Envelope opening — realistic multi-phase animation
let envelopeOpened = false;
function openEnvelopeLetter() {
  if (envelopeOpened) return;
  envelopeOpened = true;

  var sealBtn = document.getElementById('wax-seal-btn');
  var flap    = document.getElementById('env-flap-anim');
  var card    = document.getElementById('env-card');
  var letter  = document.getElementById('env-letter');
  var wrapper = document.getElementById('envelope-wrapper');

  // Step 0 — wrap every letter character in hidden spans RIGHT NOW,
  // before the letter becomes visible, so text is never shown unwrapped
  prepLetterText(letter);

  // Phase 1 — wax seal cracks (0ms)
  sealBtn.classList.add('seal-broken');

  // Phase 2 — flap slowly folds back + card slides down to reveal opening (350ms)
  setTimeout(function() {
    flap.classList.add('flap-open');
    card.style.transition = 'transform 1.1s cubic-bezier(.3,0,.2,1)';
    card.style.transform = 'translateY(72px)';
  }, 350);

  // Phase 3 — letter rises from inside (1200ms)
  setTimeout(function() {
    letter.style.opacity = '1';
    letter.style.transition = 'transform 0.7s cubic-bezier(0.2, 0, 0.3, 1)';
    letter.style.transform = 'translateY(-180px)';
  }, 1200);

  // Phase 4 — letter settles below envelope (2000ms)
  // Card has shifted down 72px, so add that to the final letter position
  setTimeout(function() {
    var cardH   = card.offsetHeight;
    var letterH = letter.offsetHeight;
    wrapper.style.transition = 'padding-bottom 0.7s cubic-bezier(0.3, 0, 0.2, 1)';
    wrapper.style.paddingBottom = (letterH + 20 + 72) + 'px';
    letter.style.transition = 'transform 0.7s cubic-bezier(0.3, 0, 0.2, 1)';
    letter.style.transform = 'translateY(' + (cardH - 60 + 72) + 'px)';
    letter.style.pointerEvents = 'auto';
  }, 2000);

  // Phase 5 — pen begins writing after letter fully settles
  setTimeout(function() {
    animateLetterWriting(letter);
  }, 3200);
}

// Pre-wrap all letter text in hidden spans so nothing is visible until written
function prepLetterText(letter) {
  if (!letter || letter.dataset.prepped) return;
  letter.dataset.prepped = '1';

  // Lock scroll position during DOM rewrite so the page doesn't jump
  var scrollY = window.scrollY;
  document.documentElement.style.overflowAnchor = 'none';

  var targets = [
    letter.querySelector('.env-letter-eyebrow'),
    letter.querySelector('.env-letter-heading')
  ].concat(Array.from(letter.querySelectorAll('p')))
   .concat([letter.querySelector('.env-letter-signoff')])
   .filter(function(el){ return el && el.textContent.trim(); });

  targets.forEach(function(el){
    var text = el.textContent;
    el.innerHTML = '';
    Array.from(text).forEach(function(ch){
      var s = document.createElement('span');
      s.className = 'letter-wc';
      s.textContent = ch;
      el.appendChild(s);
    });
  });

  // Restore scroll position after rewrite (requestAnimationFrame ensures layout settled)
  requestAnimationFrame(function() {
    window.scrollTo(0, scrollY);
    document.documentElement.style.overflowAnchor = '';
  });
}

// Animate the pen writing all the pre-hidden spans
function animateLetterWriting(letter) {
  if (!letter || letter.dataset.written) return;
  letter.dataset.written = '1';

  var allSpans = Array.from(letter.querySelectorAll('.letter-wc'));

  // Outer div — position tracking only
  var pen = document.createElement('div');
  pen.id = 'letter-pen';
  // Inner div — CSS writing animation
  var penInner = document.createElement('div');
  penInner.id = 'letter-pen-inner';
  penInner.innerHTML =
    '<svg viewBox="0 0 20 90" xmlns="http://www.w3.org/2000/svg" width="20" height="90">' +
      '<defs>' +
        '<linearGradient id="penBarrel" x1="0%" y1="0%" x2="100%" y2="0%">' +
          '<stop offset="0%"   stop-color="#1A0E08"/>' +
          '<stop offset="35%"  stop-color="#2E1C10"/>' +
          '<stop offset="60%"  stop-color="#3A2416"/>' +
          '<stop offset="100%" stop-color="#1C1008"/>' +
        '</linearGradient>' +
        '<linearGradient id="penNib" x1="0%" y1="0%" x2="100%" y2="0%">' +
          '<stop offset="0%"   stop-color="#8A6C28"/>' +
          '<stop offset="40%"  stop-color="#C8A438"/>' +
          '<stop offset="65%"  stop-color="#E0C060"/>' +
          '<stop offset="100%" stop-color="#A07C30"/>' +
        '</linearGradient>' +
      '</defs>' +
      // Barrel — rounded top, slight taper toward nib end
      '<path d="M5 3 C5 1 15 1 15 3 L16 58 L4 58 Z" fill="url(#penBarrel)"/>' +
      // Rounded cap at very top
      '<ellipse cx="10" cy="3" rx="5" ry="2.5" fill="#2A1A0E"/>' +
      // Barrel sheen (left highlight)
      '<rect x="5.5" y="4" width="1.8" height="50" rx="0.9" fill="rgba(255,220,170,0.08)"/>' +
      // Gold clip running down the side
      '<rect x="14" y="2" width="2.2" height="54" rx="1.1" fill="#C4A030"/>' +
      '<ellipse cx="15.1" cy="54.5" rx="1.6" ry="1.6" fill="#B89028"/>' +
      '<rect x="14.2" y="4" width="1.8" height="14" rx="0.9" fill="rgba(255,245,160,0.35)"/>' +
      // Gold trim band at grip
      '<rect x="3.5" y="56" width="13" height="3.5" rx="1.2" fill="#C8A832"/>' +
      '<rect x="4" y="56.8" width="12" height="1" rx="0.5" fill="rgba(255,245,160,0.4)"/>' +
      // Grip section (slightly narrower, darker)
      '<path d="M4 59 L16 59 L15 65 L5 65 Z" fill="#160C06"/>' +
      // Nib — classic tapered triangle with shoulder
      '<path d="M5 65 L15 65 L10.5 88 Z" fill="url(#penNib)"/>' +
      // Nib left shadow
      '<path d="M5 65 L10.5 88 Z" fill="rgba(0,0,0,0.25)"/>' +
      // Nib sheen
      '<path d="M7 66 Q8 74 10 85" stroke="rgba(255,245,190,0.4)" stroke-width="0.9" fill="none" stroke-linecap="round"/>' +
      // Center slit
      '<line x1="10.5" y1="68" x2="10.5" y2="88" stroke="#100804" stroke-width="0.55" opacity="0.85"/>' +
      // Ink bead at tip
      '<ellipse cx="10.5" cy="87.5" rx="1.1" ry="0.55" fill="#060302" opacity="0.95"/>' +
    '</svg>';
  pen.appendChild(penInner);
  letter.appendChild(pen);

  // Place pen at the start position
  var firstSpan = allSpans[0];
  if (firstSpan) {
    var r0 = firstSpan.getBoundingClientRect();
    var lr = letter.getBoundingClientRect();
    pen.style.left = (r0.left - lr.left) + 'px';
    pen.style.top  = (r0.top  - lr.top)  + 'px';
  }

  var delay = 0;
  var charMs = 22; // slower reveal — you can see the pen travel across each line

  allSpans.forEach(function(span){
    (function(s, d){
      setTimeout(function(){
        s.classList.add('written');
        var rect  = s.getBoundingClientRect();
        var lRect = letter.getBoundingClientRect();
        // Move the outer wrapper to track the current character
        pen.style.left = (rect.left - lRect.left + rect.width) + 'px';
        pen.style.top  = (rect.top  - lRect.top) + 'px';
      }, d);
    })(span, delay);
    delay += (span.textContent === ' ') ? 2 : charMs;
  });

  // Pen lifts off the page
  setTimeout(function(){
    pen.style.opacity = '0';
  }, delay + 800);
}
